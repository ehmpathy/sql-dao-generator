# .what = dirs depcheck must not scan for imports
# .why  = `.agent/repo=*/` are SYMLINKS into node_modules, materialized by the installed role
#         packages. depcheck follows them and reports their imports as deps absent from this
#         repo — `playwright` and two declastruct packages, none of which this repo runs
# .note  = scoped by PATH rather than by package name on purpose. a name list would go red
#          again on the next role bump that ships a skill with a new import; the scan scope
#          is the actual cause, since role boot material is not this repo's source
ignore-patterns:
  - .agent

ignores:
  - depcheck
  - declapract
  - declapract-typescript-ehmpathy
  - '@commitlint/config-conventional'
  - husky
  - '@oclif/plugin-help'
  - oclif
  - '@types/yesql'
  - 'yesql'
  - sql-schema-control # used in a shelljs to provision the schema generated by dao, for use in testing
  - simple-async-tasks # used in test assets example project domain objects
  - procedure-fns # used in generated code templates (generator outputs code that imports this)
  - visualogic
  - rhachet-brains-anthropic
  - rhachet-brains-fireworksai
  - rhachet-brains-xai
  - rhachet-roles-bhrain
  - rhachet-roles-bhrowser
  - rhachet-roles-bhuild
  - rhachet-roles-ehmpathy
  - rhachet-roles-ghlitch
  - rhachet-roles-rhachet
  - "@src/*"
  - "@src/.*"
  - rhachet
  - "@tsconfig/node20"
  - "@tsconfig/strictest"
  - "@biomejs/biome"
  - esbuild-register
  - "@swc/core"
  - "@swc/jest"
  - tsx
  - tsc-alias
  - yalc
  - pg # used in test assets example project for database connection
  - "@types/pg"
